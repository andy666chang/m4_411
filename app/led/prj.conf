
CONFIG_GPIO=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_VID=0x2FE9
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_USB_DEVICE_MANUFACTURER="Zephyr"
CONFIG_USB_DEVICE_PRODUCT="Zephyr Tracing"

# CONFIG_USB_CDC_ACM=y
# CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
# CONFIG_UART_LINE_CTRL=y

CONFIG_CONSOLE=y
CONFIG_LOG=y
# CONFIG_SHELL=y


# CONFIG_DEBUG=y

# 1. 啟用 Tracing 與 CTF 核心
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_CTF_TIMESTAMP=y

# 2. 啟用非同步緩衝與 Host 控制指令處理 (關鍵)
CONFIG_TRACING_ASYNC=y
CONFIG_TRACING_BUFFER_SIZE=8192
CONFIG_TRACING_HANDLE_HOST_CMD=y

# 3. 啟用 USB Tracing 後端
CONFIG_TRACING_BACKEND_USB=y

# 追蹤特定事件 (可視需求調整)
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_THREAD=y
CONFIG_TRACING_WORK=n
CONFIG_TRACING_ISR=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
